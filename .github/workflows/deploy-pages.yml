# Check layers + test the rules + build + smoke test the web prototype and publish it to GitHub Pages on every push to main.
# Enable Pages in the repo: Settings → Pages → Source: "GitHub Actions".
name: Web prototype

on:
  push:
    branches: [main]
    paths: ['web-prototype/**', '.github/workflows/deploy-pages.yml']
  pull_request:
    paths: ['web-prototype/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install build tools
        run: npm ci
      - name: Layer check (the core stays portable)
        run: npm run check
      - name: Rules tests (Node, no browser)
        run: npm run test:core
      - name: Build
        run: npm run build
      - name: Smoke test (build output)
        run: npm run test:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-prototype/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
