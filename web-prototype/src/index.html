// The sky: dithered institutional blue, faint rays behind the logo, blue hills with distant cranes. One art pixel = PS css px.
function paintSky(cv, Wc, Hc, cx, cy, hz){
  const PS = 4, w = Math.ceil(Wc/PS), h = Math.ceil(Hc/PS); cv.width = w; cv.height = h;
  cv.style.width = w*PS+'px'; cv.style.height = h*PS+'px';
  const g = cv.getContext('2d'), img = g.createImageData(w,h), d = img.data;
  const pal = ['#0b1f4d','#0f2c70','#163f94','#1d4cab','#2a63c9','#3f77d4','#5d8fdf','#86ade9'].map(C);
  const hy = Math.round(h*hz), rx = cx/PS, ry = cy/PS;
  const far = x => hy - 7 - 4*Math.sin(x*0.045+1.3) - 3*Math.sin(x*0.13) - (hsh(x>>2,3,5)<0.3 ? 1 : 0);
  const near = x => hy + 5 + 4*Math.sin(x*0.03+2.1) + 2*Math.sin(x*0.09+0.4);
  const farC = C('#4d78c9'), farD = C('#4570c0'), nearC = C('#24489a'), nearD = C('#1f4190'), low = C('#173576'), low2 = C('#122b62');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let c;
    const nY = near(x), fY = far(x);
    if(y >= nY){ const k = (y-nY)/Math.max(1,h-nY); c = k > 0.25 + dith(x,y)*0.5 ? low2 : (y-nY < 2 ? nearC : (dith(x,y) < 0.5 ? nearD : low)); }
    else if(y >= fY){ c = (y-fY < 1) ? sh(farC,1.08) : (dith(x,y) < 0.3 ? farD : farC); }
    else {
      const tt = clamp(y/Math.max(1,fY), 0, 0.999)*(pal.length-1), i = Math.floor(tt), f = tt-i;
      c = f > dith(x,y) ? pal[Math.min(i+1,pal.length-1)] : pal[i];
      const ang = Math.atan2(y-ry, x-rx), ray = Math.floor((ang+Math.PI)/(2*Math.PI)*28) % 2;
      if(ray && y < fY-2) c = sh(c, 1.07);
    }
    const o = (y*w+x)*4; d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  // trees on the near hills, and two tower cranes on the far ones (somebody else's model town)
  const put = (x,y,c)=>{ if(x<0||y<0||x>=w||y>=h) return; const o=(y*w+x)*4; d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; };
  for(let x=2;x<w;x+=5+Math.floor(hsh(x,9,9)*6)){ const y0 = Math.floor(near(x)); const th = 2+Math.floor(hsh(x,4,4)*3);
    for(let j=1;j<=th;j++) for(let i=-1;i<=1;i++) if(!(j===th && i)) put(x+i,y0-j,nearD); }
  [[0.18,0.9],[0.83,1.1]].forEach(([fx,sz])=>{ const x0 = Math.round(w*fx), y0 = Math.floor(far(x0)), H2 = Math.round(16*sz);
    for(let j=0;j<H2;j++) put(x0,y0-j,farD);
    for(let i=-Math.round(9*sz);i<=Math.round(5*sz);i++) put(x0+i,y0-H2,farD);
    for(let j=0;j<5;j++) put(x0+Math.round(4*sz),y0-H2+j,farD); });
  g.putImageData(img,0,0);
}
// A small cloud sprite (white on top, pale blue underneath)
function cloudCanvas(seed){
  const w = 34+Math.floor(hsh(seed,1,2)*20), h = 12, cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const g = cv.getContext('2d'), img = g.createImageData(w,h), d = img.data;
  const blobs = [[0.25,0.7,0.24],[0.5,0.45,0.32],[0.75,0.68,0.24],[0.4,0.75,0.26],[0.62,0.78,0.22]];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const inside = blobs.some(([bx,by,r])=>{ const dx=(x+0.5)/w-bx, dy=((y+0.5)/h-by)*h/w; return dx*dx+dy*dy < r*r*0.62; }) && y < h-1;
    if(!inside) continue;
    const c = y > h*0.62 ? C('#c9daf4') : (y > h*0.5 && dith(x,y) < 0.5) ? C('#dfe9f9') : C('#ffffff');
    const o=(y*w+x)*4; d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255; }
  g.putImageData(img,0,0); return cv;
}
// The diorama: a hand-placed model town, half finished, half a building site.
let dioCanvas = null;
function coverDiorama(){
  if(dioCanvas) return dioCanvas;
  const M = ['TvcRhCT', 'vpvRhCb', 'wvpRskF', 'RRRRRRR', 'wwnRhhf', 'wwmRpxf', '~~~~~~~'], n = M.length;
  const at = (r,c) => (r>=0 && c>=0 && r<n && c<n) ? M[r][c] : null;
  const OX = n*TW/2 + 16, OY = 112, cv = document.createElement('canvas');
  cv.width = n*TW + 32; cv.height = OY + (n-1)*TH + TH/2 + 40;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const put = (spr, r, c) => g.drawImage(spr.c, OX + (c-r)*TW/2 - spr.ox, OY + (c+r)*TH/2 - spr.oy);
  const mask = (r,c,ch) => { let m = 0; [[-1,0,1],[0,1,2],[1,0,4],[0,-1,8]].forEach(([dr,dc,bit])=>{ const q = at(r+dr,c+dc);
    if(q===ch || (q===null && (ch==='~' || (ch==='R' && (r===3 || c===3))))) m |= bit; }); return m; };
  const order = []; for(let r=0;r<n;r++) for(let c=0;c<n;c++) order.push([r+c, c, r]);
  order.sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
  let k = 0;
  const groundOf = (ch, r, c) => { const v = (r*7+c*3)%3;
    switch(ch){
      case 'R': return roadTile(mask(r,c,'R'), false);
      case '~': return riverTile(mask(r,c,'~'));
      case 'w': return GROUNDS.farm((r+c*2)%4, (r+c)%2);
      case 'v': case 'c': return GROUNDS.village(v);
      case 'T': return GROUNDS.habitat(v);
      case 'p': return GROUNDS.park(v);
      case 'h': case 'k': return GROUNDS.plaza(v);
      case 's': return GROUNDS.school(v);
      case 'f': return GROUNDS.yard(v);
      case 'n': return GROUNDS.serviced(v);
      case 'm': return GROUNDS.muni(v);
      default: return GROUNDS.earth(v); } };
  order.forEach(([,c,r])=>{ const ch = M[r][c]; put(groundOf(ch,r,c), r, c);
    if(r===n-1) put(skirt('L'), r, c); if(c===n-1) put(skirt('R'), r, c); });
  order.forEach(([,c,r])=>{ const ch = M[r][c];
    switch(ch){
      case 'v': put(BUILDINGS.village(1 + (k++ % 3)), r, c); break;
      case 'c': put(BUILDINGS.village(0), r, c); break;
      case 'T': put(BUILDINGS.habitat(r+c), r, c); break;
      case 'p': put(BUILDINGS.park(0), r, c); break;
      case 'h': put(BUILDINGS.housing((r+c)%3), r, c); break;
      case 's': put(BUILDINGS.school(0), r, c); break;
      case 'k': put(BUILDINGS.clinic(0), r, c); break;
      case 'f': put(BUILDINGS.factory(0), r, c); break;
      case 'C': put(siteSprite(r ? 11 : 26), r, c); break;
      case 'b': put(billboardSprite(), r, c); break;
      case 'F': put(fenceSprite(), r, c); break;
      case 'n': put(noticeSprite(), r, c); break;
      case 'm': put(flagSprite(), r, c); break;
      case 'x': put(ruinSprite(), r, c); break; } });
  // crop to the painted pixels (plus a 2px margin) so the scene can be shown as large as possible
  const px = g.getImageData(0,0,cv.width,cv.height).data; let x0=cv.width, y0=cv.height, x1=0, y1=0;
  for(let y=0;y<cv.height;y++) for(let x=0;x<cv.width;x++) if(px[(y*cv.width+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const out = document.createElement('canvas'); out.width = x1-x0+5; out.height = y1-y0+5;
  out.getContext("2d").drawImage(cv, 2-x0, 2-y0);
  return dioCanvas = out;
}
// Fit the scene to the screen: sky, rays behind the logo, the diorama at a whole-pixel scale
function layoutCover(){
  if(!coverOpen()) return;
  const sky = $('coverSky'), stage = cover.querySelector('.cv-stage'), dio = cover.querySelector('.cv-dio canvas'), box = cover.querySelector('.cv-dio');
  if(!sky || !stage || !dio) return;
  const cr = cover.getBoundingClientRect(), lr = cover.querySelector('.cv-logo').getBoundingClientRect();
  const dprC = window.devicePixelRatio || 1;
  dio.style.width = '1px'; dio.style.height = '1px';
  const br = box.getBoundingClientRect(), availW = Math.max(120, br.width), availH = Math.max(100, br.height);
  // whole device pixels when the art is big; half steps below 3× (invisible on dense screens) so phones get a decent size
  const fitK = Math.min(availW*dprC/dio.width, availH*dprC/dio.height), k = fitK >= 3 ? Math.floor(fitK) : Math.max(1, Math.floor(fitK*2)/2);
  dio.style.width = dio.width*k/dprC + 'px'; dio.style.height = dio.height*k/dprC + 'px';
  const dr = dio.getBoundingClientRect();
  const hz = clamp((dr.top + dr.height*0.42 - cr.top)/cr.height, 0.45, 0.85);
  paintSky(sky, cr.width, cr.height, lr.left + lr.width/2 - cr.left, lr.top + lr.height/2 - cr.top, hz);
}

function pauseMenu(){
  setMusic('main', 0.4);
  letter({icon:'pause', title:t('pause.t'), body:`<p>${t('pause.x',{town:S.town, country:country(), m:Math.min(S.month,CFG.months), n:CFG.months})}</p><p class="keys">${t('lvl.keys')}</p>`,
    buttons:[btn(t('pause.back'),'play_arrow', ()=>{ setMusic('main'); hideModal(); }, true), musicButton(), ...langButtons(),
      btn(t('lvl.retry'),'replay', ()=>startLevel(S.level)), btn(t('menu.main'),'logout', ()=>{ startMenu(); })]});
  updateMusicBtn(); rerender = pauseMenu;
}
function setLang(l){
  LANG = l; try{ localStorage.setItem('eurocrat_lang', l); }catch(e){}
  playSound('click'); refresh(); if(rerender && (!modal.classList.contains('hidden') || coverOpen())) rerender();
}
function frameView(){ resize(); zoom = defaultZoom();
  const v = S.grid.findIndex(p=>p.k==='village'); if(N>=16 && v>=0) centreOn(v); else { MAPCX = 0; MAPCY = (N-1)*TH/2 - 12; clampCam(); } }
function startNew(seed, level){ hideCover(); newGame(seed, level===undefined ? campaign().max : level); selected=-1; sheet=null; viewRot=0; frameView(); save(); setMusic('main'); refresh(); showNext(); }
function startLevel(k){ startNew(undefined, k); }
function afterLoad(){ hideCover(); selected=-1; sheet=null; setMapSize(LEVELS[S.level||0].n); frameView(); setMusic('main'); refresh(); showNext(); }

// =====================================================================
//  INPUT — tap to select · drag (one finger / mouse) to move · pinch / wheel / +− to zoom
//  Keyboard: WASD or arrows move, + − zoom, R rotates, C centres, Space ends the month, Esc closes / pauses
// =====================================================================
const pointers = new Map(); let pinchD=0, pinchZ=1, pinchMid=null, dragged=false, downAt=null, lastAt=null;
cvs.addEventListener('pointerdown', e=>{
  hidePop(); try{ cvs.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ downAt={x:e.clientX,y:e.clientY}; lastAt={...downAt}; dragged=false; }
  if(pointers.size===2){ const p=[...pointers.values()]; pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1; pinchZ=zoom; dragged=true;
    pinchMid={x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
});
cvs.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r = cvs.getBoundingClientRect();
  if(pointers.size===2){ const p=[...pointers.values()], d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1, mid={x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2};
    panBy(mid.x-pinchMid.x, mid.y-pinchMid.y); pinchMid = mid; zoomAt(pinchZ*d/pinchD, mid.x-r.left, mid.y-r.top); return; }
  if(pointers.size===1 && downAt){
    if(!dragged && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 9){ dragged = true; $('hint').classList.add('used'); }
    if(dragged){ panBy(e.clientX-lastAt.x, e.clientY-lastAt.y); }
    lastAt = {x:e.clientX, y:e.clientY}; }
});
function up(e){
  const wasSingle = pointers.size===1; pointers.delete(e.pointerId);
  if(wasSingle && !dragged && downAt){
    const r = cvs.getBoundingClientRect(); const i = tileAt(e.clientX-r.left, e.clientY-r.top);
    if(i<0 || i===selected){ selected = -1; if(sheet==='parcel') sheet = null; }
    else { selected = i; sheet = 'parcel'; }
    playSound('click'); refresh(); if(selected>=0) keepVisible(selected);
  }
  if(!pointers.size){ downAt=null; }
}
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); if(!pointers.size) downAt=null; });
cvs.addEventListener('wheel', e=>{ e.preventDefault(); const r = cvs.getBoundingClientRect();
  if(e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)*1.5 && !e.shiftKey) zoomAt(zoom*Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top);
  else panBy(-e.deltaX, -e.deltaY); }, {passive:false});
// Keyboard: smooth movement while keys are held
const held = new Set(); let keyLoop = 0;
const PAN_KEYS = {w:[0,1], arrowup:[0,1], s:[0,-1], arrowdown:[0,-1], a:[1,0], arrowleft:[1,0], d:[-1,0], arrowright:[-1,0]};
function keyStep(){ let dx=0, dy=0; held.forEach(k=>{ const v = PAN_KEYS[k]; if(v){ dx+=v[0]; dy+=v[1]; } });
  if(dx||dy){ panBy(dx*12, dy*12); keyLoop = requestAnimationFrame(keyStep); } else keyLoop = 0; }
addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input,textarea')) return;
  const k = e.key.toLowerCase(), modalOpen = !modal.classList.contains('hidden');
  if(coverOpen()){ if((k==='enter' || k===' ') && !(e.target.closest && e.target.closest('button'))){ e.preventDefault(); cover.querySelector('.cv-play').click(); } return; }
  if(k==='escape'){ if(sheet) closeSheet(); else if(!modalOpen && S && !S.over) pauseMenu(); return; }
  if(modalOpen) return;
  if(PAN_KEYS[k]){ e.preventDefault(); held.add(k); if(!keyLoop) keyLoop = requestAnimationFrame(keyStep); return; }
  if(k==='+' || k==='=') zoomAt(zoom*1.25); else if(k==='-' || k==='_') zoomAt(zoom/1.25);
  else if(k==='r'){ viewRot=(viewRot+1)%4; playSound('click'); draw(); }
  else if(k==='c') frameView(), present();
  else if(k===' ' && !e.repeat){ e.preventDefault(); $('endTurn').click(); }
});
addEventListener('keyup', e=>{ held.delete(e.key.toLowerCase()); });
addEventListener('blur', ()=>held.clear());
$('rotateBtn').onclick = ()=>{ viewRot=(viewRot+1)%4; playSound('click'); draw(); };
$('zoomInBtn').onclick = ()=>{ playSound('click'); zoomAt(zoom*1.3); };
$('zoomOutBtn').onclick = ()=>{ playSound('click'); zoomAt(zoom/1.3); };
$('centreBtn').onclick = ()=>{ playSound('click'); if(selected>=0) centreOn(selected); else frameView(); present(); };
$('menuBtn').onclick = ()=>{ playSound('click'); pauseMenu(); };
$('musicBtn').onclick = toggleMusic;
$('langBtn').onclick = ()=> setLang(LANG==='es' ? 'en' : 'es');
$('bellBtn').onclick = ()=>{ playSound('click'); sheet==='problems' ? closeSheet() : openSheet('problems'); };
$('sheetClose').onclick = ()=>{ playSound('click'); closeSheet(); };
$('dirPill').onclick = ()=>{ playSound('click'); openSheet('agenda'); };
document.querySelectorAll('.tab[data-tab]').forEach(b=> b.onclick = ()=>{ playSound('click'); const tb = b.dataset.tab; if(sheet===tb) closeSheet(); else { selected=-1; openSheet(tb); } });
$('endTurn').onclick = ()=>{
  if(S.over){ showNext(); return; }
  if(S.cards.length || S.perkChoice){ showNext(); return; }
  playSound('turn'); endMonth(); selected=-1; if(sheet==='parcel') sheet=null; refresh(); flushFx(); showNext(); };
document.querySelectorAll('.meter').forEach(el=> el.addEventListener('click', ev=>{ ev.stopPropagation(); playSound('click'); showMeterPop(el.dataset.m); }));
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('#pop') && !e.target.closest('.meter')) hidePop(); });
addEventListener('resize', resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(worldEl);
// =====================================================================
//  BOOT + test hook (used by tests/smoke_test.py and tests/balance.py)
// =====================================================================
window.__eurocrat = {
  get S(){ return S; }, CFG, B, EVENTS, LEVELS, newGame:(seed, level=3)=>{ startNew(seed, level); S.cards=[]; hideModal(); return S; },
  startLevel, campaign, carryPerk, openSheet, closeSheet, get sheet(){ return sheet; }, guideStep, get zoom(){ return zoom; }, get cam(){ return [MAPCX, MAPCY]; },
  panBy, zoomAt, centreOn, on,
  acquire, requestPermit, sellPlot, submitPlan, lobby, consult, fileReport, repay, endMonth, choosePerk, caps, residents, hasAccess,
  choicesFor, resolveEvent, problems, activeCombos, comboPreview, comboFx, discovered, COMBOS, catalogueCard, t, setLang, get lang(){ return LANG; },
  // resolve the first pending card: event cards with the given (or first) choice, other cards just acknowledged
  resolveCard:(k)=>{ const c=S.cards[0]; if(!c) return null; if(c.type==='event'){ const ch=k||choicesFor(c)[0].k; S.cards.shift(); const r=resolveEvent(c,ch); if(r) S.cards.unshift({type:'result', id:c.id, res:r, v:c.v}); return r; } S.cards.shift(); return true; },
  tileAt:(x,y)=>tileAt(x,y), screenOf:(i)=>{ const [ix,iy]=isoOf(...rc(i)); return toScreen(ix,iy); },
  refresh, showNext, hideModal, get selected(){ return selected; }, spriteSheet, portrait,
};
newGame(1, 0); resize(); refresh(); startMenu();
Object.keys(CHARS).forEach(makePixelPortrait);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>draw());
})();
</script>
