<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>City Builder — Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap">
<style>
  :root{
    --bg:#060a10; --panel:rgba(8,14,20,.93); --ink:#d9fbff; --sub:#5f8690;
    --grass:#2d3b30; --road:#15171c; --house:#ffb020; --shop:#00c2ff; --park:#39ff6a;
    --accent:#00e5ff; --danger:#ff2e4d; --border:rgba(0,229,255,.28);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Share Tech Mono',monospace;
    overflow:hidden; touch-action:none;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .material-icons{
    font-family:'Material Icons',sans-serif; font-weight:normal; font-style:normal;
    font-size:18px; line-height:1; letter-spacing:normal; text-transform:none;
    display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr;
    vertical-align:middle; -webkit-font-smoothing:antialiased;
  }
  #hud{
    position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; background:var(--panel); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap;
    box-shadow:0 0 16px rgba(0,229,255,.1);
  }
  #hud h1{
    font-family:'Orbitron',sans-serif; font-size:14px; margin:0; font-weight:900;
    letter-spacing:.08em; text-transform:uppercase; display:flex; align-items:center; gap:8px; color:var(--accent);
  }
  .stats{display:flex; gap:16px; font-size:13px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em;}
  .stats span{display:flex; align-items:center; gap:5px;}
  .stats b{color:var(--ink);}
  .hud-actions{display:flex; gap:6px;}
  .hud-btn{
    background:rgba(0,229,255,.06); border:1px solid var(--border); border-radius:0;
    padding:6px 9px; color:var(--ink); cursor:pointer; display:flex; align-items:center;
  }
  #tools{
    position:fixed; bottom:env(safe-area-inset-bottom,0px); left:0; right:0; z-index:10;
    display:flex; gap:8px; padding:10px 12px; background:var(--panel);
    backdrop-filter:blur(8px); border-top:1px solid var(--border); overflow-x:auto;
    box-shadow:0 0 16px rgba(0,229,255,.1);
  }
  .tool{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 12px; border-radius:0; border:1px solid var(--border); border-top:3px solid var(--tcolor,transparent);
    background:rgba(0,229,255,.04); cursor:pointer; color:var(--ink); font-size:10px;
    text-transform:uppercase; letter-spacing:.04em; font-family:'Share Tech Mono',monospace;
  }
  .tool.active{border-color:var(--accent); background:rgba(0,229,255,.16); box-shadow:0 0 10px rgba(0,229,255,.35);}
  #world{ position:absolute; inset:0; overflow:hidden; touch-action:none; }
  #viewport{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    transform-origin:center center; will-change:transform;
  }
  #grid{ position:relative; }
  .tile{
    position:absolute; width:64px; height:32px;
    clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    transition:filter .15s, left .25s ease, top .25s ease;
    outline:1px solid rgba(0,229,255,.06);
  }
  .tile[data-t="grass"]{background:var(--grass);}
  .tile[data-t="road"]{background:var(--road);}
  .tile[data-t="house"]{background:var(--house);}
  .tile[data-t="shop"]{background:var(--shop);}
  .tile[data-t="park"]{background:var(--park);}
  #hint{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + var(--hud-h,48px) + 14px);
    left:0; right:0; z-index:5; text-align:center; font-size:11px;
    color:var(--sub); pointer-events:none; text-transform:uppercase; letter-spacing:.06em;
  }
  .float-txt{
    position:fixed; transform:translate(-50%,-50%); font-weight:700; font-size:12px;
    color:var(--accent); pointer-events:none; z-index:40; text-shadow:0 0 6px rgba(0,229,255,.6);
    animation: floatUp .9s ease-out forwards; display:flex; align-items:center; gap:4px;
    text-transform:uppercase; letter-spacing:.04em; font-family:'Share Tech Mono',monospace;
  }
  .float-txt .material-icons{font-size:14px;}
  @keyframes floatUp{
    0%{ opacity:1; transform:translate(-50%,-50%); }
    100%{ opacity:0; transform:translate(-50%,-170%); }
  }
  #menu{
    position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    background:rgba(2,4,8,.72); backdrop-filter:blur(4px);
  }
  #menu.hidden{display:none;}
  .menu-panel{
    background:var(--panel); border:1px solid var(--border); border-radius:0;
    padding:28px 24px; width:88%; max-width:320px; text-align:center;
    box-shadow:0 0 30px rgba(0,229,255,.18);
  }
  .menu-panel h2{
    font-family:'Orbitron',sans-serif; margin:0 0 4px; font-size:18px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--accent); display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .menu-panel p{color:var(--sub); font-size:12px; margin:0 0 18px; line-height:1.5;}
  .menu-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:10px;
    padding:13px; border-radius:0; border:1px solid var(--border); background:rgba(0,229,255,.08);
    color:var(--ink); font-size:13px; font-weight:700; cursor:pointer; text-transform:uppercase;
    letter-spacing:.05em; font-family:'Share Tech Mono',monospace;
  }
  .menu-btn.primary{background:var(--accent); color:#031018; border-color:var(--accent);}
  .menu-btn.danger{background:transparent; border-color:var(--danger); color:var(--danger);}
</style>
</head>
<body>
<div id="hud">
  <h1><span class="material-icons">location_city</span>City Builder</h1>
  <div class="stats">
    <span><span class="material-icons" style="font-size:16px;">people</span><b id="pop">0</b></span>
    <span><span class="material-icons" style="font-size:16px;">attach_money</span><b id="coin">0</b></span>
  </div>
  <div class="hud-actions">
    <button class="hud-btn" id="musicBtn" aria-label="Toggle music"><span class="material-icons">music_note</span></button>
    <button class="hud-btn" id="rotateBtn"><span class="material-icons">sync</span></button>
    <button class="hud-btn" id="menuBtn"><span class="material-icons">menu</span></button>
  </div>
</div>
<div id="hint">Tap to build · pinch to zoom</div>
<div id="world"><div id="viewport"><div id="grid"></div></div></div>
<div id="tools"></div>
<div id="menu"><div class="menu-panel" id="menuPanel"></div></div>

<script>
(function(){
  const N = 10;
  const TW = 64, TH = 32;
  const types = [
    {id:'grass', label:'Demolish', icon:'delete', color:'var(--danger)', cost:0},
    {id:'road',  label:'Road',    icon:'add_road', color:'var(--road)', cost:1},
    {id:'house', label:'House',   icon:'home', color:'var(--house)', cost:5},
    {id:'shop',  label:'Shop',    icon:'store', color:'var(--shop)', cost:10},
    {id:'park',  label:'Park',    icon:'park', color:'var(--park)', cost:3},
  ];
  const costMap = Object.fromEntries(types.map(t=>[t.id, t.cost]));
  let current = 'road';
  let state = null;

  let actx;
  function ensureAudio(){
    if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(actx.state==='suspended') actx.resume();
  }
  // --- Music: looping soundtrack via Web Audio (gapless loops, crossfades) ---
  // Ogg Vorbis where supported, AAC (.m4a) fallback for older Safari/iOS.
  const music = {
    on: (()=>{ try{ return localStorage.getItem('citybuilder_music') !== 'off'; }catch(e){ return true; } })(),
    want: null, playing: null, src: null, gain: null, buffers: {}, loading: {},
    ext: (()=>{ const a=document.createElement('audio');
      return a.canPlayType && a.canPlayType('audio/ogg; codecs="vorbis"') ? 'ogg' : 'm4a'; })(),
    level: 1,
  };
  const TRACKS = { menu:'citybuilder_menu_theme', main:'citybuilder_main_theme' };
  const MUSIC_VOL = 0.45;
  function loadTrack(name){
    if(music.buffers[name]) return Promise.resolve(music.buffers[name]);
    if(!music.loading[name]){
      music.loading[name] = fetch(`audio/${TRACKS[name]}.${music.ext}`)
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(b=>new Promise((ok,ko)=>actx.decodeAudioData(b, ok, ko)))
        .then(buf=>(music.buffers[name]=buf))
        .catch(e=>{ delete music.loading[name]; throw e; });
    }
    return music.loading[name];
  }
  function fadeOutCurrent(t=0.8){
    music.playing = null;
    if(!music.src) return;
    const {src, gain} = music, now = actx.currentTime;
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.linearRampToValueAtTime(0, now+t);
    src.stop(now+t+0.05);
    music.src = music.gain = music.playing = null;
  }
  function syncMusic(){
    // No music when opened as a local file (fetch is blocked there) or when muted
    if(location.protocol==='file:' || !actx) return;
    const name = music.on ? music.want : null;
    if(name === music.playing){
      if(music.gain){ const now=actx.currentTime;
        music.gain.gain.cancelScheduledValues(now);
        music.gain.gain.setValueAtTime(music.gain.gain.value, now);
        music.gain.gain.linearRampToValueAtTime(MUSIC_VOL*music.level, now+0.4); }
      return;
    }
    fadeOutCurrent();
    if(!name) return;
    music.playing = name;
    loadTrack(name).then(buf=>{
      if(music.playing !== name || music.src) return;  // changed while loading
      const src = actx.createBufferSource(), gain = actx.createGain();
      src.buffer = buf; src.loop = true;
      src.connect(gain); gain.connect(actx.destination);
      const now = actx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(MUSIC_VOL*music.level, now+1.2);
      src.start(now);
      music.src = src; music.gain = gain;
    }).catch(()=>{ if(music.playing===name) music.playing=null; });
  }
  // track: 'menu' | 'main'; level: 1 = full, <1 = ducked (pause screen)
  function setMusic(track, level=1){ music.want = track; music.level = level; syncMusic(); }
  function updateMusicBtn(){
    document.querySelector('#musicBtn .material-icons').textContent = music.on ? 'music_note' : 'music_off';
    const m = document.getElementById('btnMusic');
    if(m) m.querySelector('.label').textContent = 'Music: ' + (music.on ? 'On' : 'Off');
  }
  function toggleMusic(){
    music.on = !music.on;
    try{ localStorage.setItem('citybuilder_music', music.on ? 'on' : 'off'); }catch(e){}
    ensureAudio(); updateMusicBtn(); syncMusic();
  }
  // iOS/Safari only allow audio after a user gesture: unlock on the first touch/click
  function unlockAudio(){
    try{ ensureAudio(); syncMusic(); }catch(e){}
    removeEventListener('pointerdown', unlockAudio, true);
    removeEventListener('keydown', unlockAudio, true);
  }
  addEventListener('pointerdown', unlockAudio, true);
  addEventListener('keydown', unlockAudio, true);
  // Silence everything while the app is in the background
  document.addEventListener('visibilitychange', ()=>{
    if(!actx) return;
    if(document.hidden) actx.suspend(); else actx.resume();
  });

  function playSound(type){
    try{
      ensureAudio();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      const freqs = {build:660, fail:140, demolish:220, click:500};
      o.frequency.value = freqs[type]||440;
      o.type = type==='fail' ? 'square' : (type==='demolish' ? 'sawtooth' : 'sine');
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, actx.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.18);
      o.start(); o.stop(actx.currentTime+0.2);
    }catch(e){}
  }
  function flash(el){
    el.style.filter='brightness(0.45)';
    setTimeout(()=>{ el.style.filter=''; }, 160);
  }
  function floatText(x,y,text,icon){
    const f = document.createElement('div');
    f.className='float-txt';
    f.innerHTML = (icon?`<span class="material-icons">${icon}</span>`:'') + `<span>${text}</span>`;
    f.style.left=x+'px'; f.style.top=y+'px';
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 900);
  }
  function toast(msg, icon){ floatText(window.innerWidth/2, 100, msg, icon); }
  function hasAdjacentRoad(r,c){
    const deltas=[[-1,0],[1,0],[0,-1],[0,1]];
    return deltas.some(([dr,dc])=>{
      const rr=r+dr, cc=c+dc;
      if(rr<0||rr>=N||cc<0||cc>=N) return false;
      return state.grid[rr*N+cc]==='road';
    });
  }

  function loadState(){
    try{ const raw = localStorage.getItem('citybuilder_v1'); if(raw) return JSON.parse(raw); }catch(e){}
    return null;
  }
  function saveState(){
    try{ localStorage.setItem('citybuilder_v1', JSON.stringify(state)); }catch(e){}
  }

  state = loadState() || { grid: Array.from({length:N*N}, ()=> 'grass'), coin: 20 };

  const gridEl = document.getElementById('grid');
  const originX = (N-1) * TW/2;
  gridEl.style.width = (N*TW) + 'px';
  gridEl.style.height = (N*TH) + 'px';

  let viewRot = 0;
  function rotateCoord(r,c,steps){
    let rr=r, cc=c;
    for(let i=0;i<((steps%4+4)%4);i++){ const nr=cc, nc=(N-1-rr); rr=nr; cc=nc; }
    return [rr,cc];
  }
  function layoutTile(el){
    const r=+el.dataset.r, c=+el.dataset.c;
    const [r2,c2]=rotateCoord(r,c,viewRot);
    el.style.left=((c2-r2)*TW/2+originX)+'px';
    el.style.top=((c2+r2)*TH/2)+'px';
  }
  function updateLayout(){ tileEls.forEach(layoutTile); }

  const tileEls = [];
  for(let r=0; r<N; r++){
    for(let c=0; c<N; c++){
      const i = r*N + c;
      const el = document.createElement('div');
      el.className = 'tile';
      el.dataset.t = state.grid[i];
      el.dataset.r = r; el.dataset.c = c;
      el.addEventListener('click', ()=>{
        if(recentPinch) return;
        const rect = el.getBoundingClientRect();
        handleBuild(el, rect.left+rect.width/2, rect.top+rect.height/2);
      });
      gridEl.appendChild(el);
      tileEls.push(el);
    }
  }
  updateLayout();
  function rebuildGrid(){
    tileEls.forEach((el,i)=>{ el.dataset.t = state.grid[i]; });
  }

  function handleBuild(el, cx, cy){
    const r = +el.dataset.r, c = +el.dataset.c, i = r*N+c;
    const cost = costMap[current]||0;
    if(current!=='grass' && current!=='road' && !hasAdjacentRoad(r,c)){
      playSound('fail'); flash(el); floatText(cx,cy,'no road nearby','block'); return;
    }
    if(state.coin < cost){ playSound('fail'); flash(el); floatText(cx,cy,'no funds','money_off'); return; }
    state.coin -= cost;
    state.grid[i] = current;
    el.dataset.t = current;
    if(current==='grass'){
      playSound('demolish'); floatText(cx,cy,'demolished','delete');
    }else{
      playSound('build'); floatText(cx,cy, cost ? ('-'+cost) : 'ok', 'add_circle');
    }
    saveState();
    updateHUD();
  }

  // --- Zoom (pinch gesture / mouse wheel) — no gesture panning or rotation ---
  const worldEl = document.getElementById('world');
  const viewportEl = document.getElementById('viewport');
  let scale=1;
  function applyTransform(){ viewportEl.style.transform = `scale(${scale})`; }
  const pointers = new Map();
  let pinchStartDist=0, pinchStartScale=1, recentPinch=false;

  worldEl.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts=[...pointers.values()];
      pinchStartDist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      pinchStartScale=scale; recentPinch=true;
    }
  });
  worldEl.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts=[...pointers.values()];
      const dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      scale=Math.min(2.5, Math.max(0.5, pinchStartScale*(dist/pinchStartDist)));
      applyTransform();
    }
  });
  function releasePointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size===0 && recentPinch){ setTimeout(()=>{ recentPinch=false; }, 150); }
  }
  worldEl.addEventListener('pointerup', releasePointer);
  worldEl.addEventListener('pointercancel', releasePointer);
  worldEl.addEventListener('wheel', e=>{
    e.preventDefault();
    scale=Math.min(2.5, Math.max(0.5, scale - e.deltaY*0.001));
    applyTransform();
  }, {passive:false});

  document.getElementById('rotateBtn').addEventListener('click', ()=>{
    viewRot=(viewRot+1)%4; updateLayout(); playSound('click');
  });

  const toolsEl = document.getElementById('tools');
  types.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tool' + (t.id===current ? ' active' : '');
    b.style.setProperty('--tcolor', t.color);
    b.innerHTML = `<span class="material-icons">${t.icon}</span><span>${t.label}${t.cost?(' · '+t.cost):''}</span>`;
    b.addEventListener('click', ()=>{
      current = t.id;
      [...toolsEl.children].forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      playSound('click');
    });
    toolsEl.appendChild(b);
  });

  function counts(){
    let houses=0, shops=0;
    state.grid.forEach(t=>{ if(t==='house') houses++; if(t==='shop') shops++; });
    return {houses, shops};
  }
  // Refresh the HUD only. Income is granted exclusively by the timed tick,
  // so player actions (build, demolish, menus) can never generate coins.
  function updateHUD(){
    const {houses} = counts();
    document.getElementById('pop').textContent = houses * 4;
    document.getElementById('coin').textContent = state.coin;
  }
  function tick(){
    const {houses, shops} = counts();
    state.coin += shops * 2 + Math.floor(houses * 0.5);
    updateHUD();
    saveState();
  }

  // --- Menu: start / pause / save / load / exit ---
  let tickTimer=null;
  function startTick(){ if(!tickTimer) tickTimer=setInterval(tick,2000); }
  function stopTick(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }

  const menuEl = document.getElementById('menu');
  const menuPanel = document.getElementById('menuPanel');
  function showMenu(screen){ menuEl.classList.remove('hidden'); renderMenu(screen); }
  function hideMenu(){ menuEl.classList.add('hidden'); }

  function doSave(){
    try{ localStorage.setItem('citybuilder_save', JSON.stringify(state)); toast('saved','check_circle'); }
    catch(e){ toast('save failed','warning'); }
  }
  function doLoad(){
    try{
      const raw=localStorage.getItem('citybuilder_save');
      if(!raw){ toast('no saved game','warning'); return; }
      state=JSON.parse(raw); rebuildGrid(); saveState();
      hideMenu(); startTick(); setMusic('main'); updateHUD(); toast('loaded','check_circle');
    }catch(e){ toast('load failed','warning'); }
  }

  function renderMenu(screen){
    if(screen==='start'){
      menuPanel.innerHTML = `<h2><span class="material-icons">location_city</span>City Builder</h2><p>Isometric prototype</p>
        <button class="menu-btn primary" id="btnPlay"><span class="material-icons">play_arrow</span>Play</button>
        <button class="menu-btn" id="btnLoad"><span class="material-icons">folder_open</span>Load game</button>
        <button class="menu-btn" id="btnMusic"><span class="material-icons">music_note</span><span class="label">Music</span></button>
        <button class="menu-btn danger" id="btnExit"><span class="material-icons">power_settings_new</span>Exit</button>`;
      setMusic('menu');
      document.getElementById('btnPlay').onclick=()=>{ hideMenu(); startTick(); setMusic('main'); };
      document.getElementById('btnLoad').onclick=doLoad;
      document.getElementById('btnExit').onclick=()=>showMenu('exit');
      document.getElementById('btnMusic').onclick=toggleMusic;
      updateMusicBtn();
    }else if(screen==='pause'){
      menuPanel.innerHTML = `<h2><span class="material-icons">pause</span>Paused</h2>
        <button class="menu-btn primary" id="btnResume"><span class="material-icons">play_arrow</span>Resume</button>
        <button class="menu-btn" id="btnSave"><span class="material-icons">save</span>Save game</button>
        <button class="menu-btn" id="btnLoad"><span class="material-icons">folder_open</span>Load game</button>
        <button class="menu-btn" id="btnMusic"><span class="material-icons">music_note</span><span class="label">Music</span></button>
        <button class="menu-btn danger" id="btnExit"><span class="material-icons">power_settings_new</span>Exit</button>`;
      setMusic('main', 0.4);
      document.getElementById('btnResume').onclick=()=>{ hideMenu(); startTick(); setMusic('main'); };
      document.getElementById('btnSave').onclick=doSave;
      document.getElementById('btnLoad').onclick=doLoad;
      document.getElementById('btnExit').onclick=()=>showMenu('exit');
      document.getElementById('btnMusic').onclick=toggleMusic;
      updateMusicBtn();
    }else if(screen==='exit'){
      stopTick();
      setMusic('menu', 0.6);
      menuPanel.innerHTML = `<h2><span class="material-icons">power_settings_new</span>Disconnected</h2><p>Your game is saved automatically. You can close this tab.</p>
        <button class="menu-btn primary" id="btnBack"><span class="material-icons">arrow_back</span>Back to start</button>`;
      document.getElementById('btnBack').onclick=()=>showMenu('start');
    }
  }

  document.getElementById('musicBtn').addEventListener('click', toggleMusic);
  document.getElementById('menuBtn').addEventListener('click', ()=>{ stopTick(); showMenu('pause'); });

  // Keep the hint below the HUD: expose the HUD height as a CSS variable
  const hudEl = document.getElementById('hud');
  function syncHudHeight(){ document.documentElement.style.setProperty('--hud-h', hudEl.offsetHeight+'px'); }
  syncHudHeight();
  if(window.ResizeObserver) new ResizeObserver(syncHudHeight).observe(hudEl);
  addEventListener('resize', syncHudHeight);

  updateHUD();
  showMenu('start');
  updateMusicBtn();
})();
</script>
</body>
</html>
