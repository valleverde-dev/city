<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Eurocrat</title>
<!-- The build (scripts/build.mjs) inlines styles/index.css here, fonts included -->
<!-- @styles -->
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="brand"><i class="emblem" aria-hidden="true"></i><h1>EUROCRAT <small id="townName"></small></h1></div>
    <div class="stats">
      <span class="stat" id="st-month"><i class="ico i-event"></i><b id="month">1</b><span class="of">/<span id="months">36</span></span></span>
      <span class="stat" id="st-funds"><i class="ico i-euro"></i><b id="funds">0</b></span>
      <span class="stat debt" id="st-debt" hidden><i class="ico i-account_balance_wallet"></i><b id="debt">0</b></span>
      <span class="stat" id="st-res"><i class="ico i-groups"></i><b id="residents">0</b><span class="of">/<span id="target">600</span></span></span>
      <span class="stat" id="st-slots"><span class="slots" id="slots"></span></span>
    </div>
    <div class="hud-actions">
      <button class="hud-btn" id="bellBtn" aria-label="Problems"><i class="ico i-report"></i><span class="badge" id="bellN" hidden>0</span></button>
      <button class="hud-btn" id="langBtn" aria-label="Language">ES</button>
      <button class="hud-btn" id="musicBtn" aria-label="Music"><i class="ico i-music_note"></i></button>
      <button class="hud-btn" id="menuBtn" aria-label="Menu"><i class="ico i-menu"></i></button>
    </div>
  </div>
  <div id="meters">
    <div class="meter" id="m-local" data-m="local"><div class="top"><span><i class="ico i-how_to_vote"></i><span class="lbl"></span></span><span><b>0</b><span class="delta"></span></span></div><div class="bar"><i></i></div></div>
    <div class="meter" id="m-neigh" data-m="neigh"><div class="top"><span><i class="ico i-diversity_3"></i><span class="lbl"></span></span><span><b>0</b><span class="delta"></span></span></div><div class="bar"><i></i></div></div>
    <div class="meter" id="m-comp" data-m="comp"><div class="top"><span><i class="ico i-fact_check"></i><span class="lbl"></span></span><span><b>0</b><span class="delta"></span></span></div><div class="bar"><i></i></div></div>
    <div class="meter" id="m-spent" data-m="spent"><div class="top"><span><i class="ico i-savings"></i><span class="lbl"></span></span><span><b>0</b></span></div><div class="bar"><i></i></div></div>
  </div>
  <div id="main">
    <div id="world">
      <canvas id="map"></canvas>
      <div id="hint"></div>
      <button id="dirPill" hidden></button>
      <div id="mapBtns">
        <button class="mapbtn" id="zoomInBtn" aria-label="Zoom in">+</button>
        <button class="mapbtn" id="zoomOutBtn" aria-label="Zoom out">−</button>
        <button class="mapbtn" id="centreBtn" aria-label="Centre"><i class="ico i-place"></i></button>
        <button class="mapbtn" id="rotateBtn" aria-label="Rotate view"><i class="ico i-rotate_right"></i></button>
      </div>
      <div id="guide" hidden></div>
    </div>
    <div id="sheet" hidden><div class="sheet-head"><h3 id="sheetTitle"></h3><button id="sheetClose" aria-label="Close"><i class="ico i-close"></i></button></div><div id="sheetBody"></div></div>
  </div>
  <nav id="tabs">
    <button class="tab" data-tab="agenda"><i class="ico i-work"></i><span></span></button>
    <button class="tab" data-tab="city"><i class="ico i-insights"></i><span></span></button>
    <button class="tab end" id="endTurn"><i class="ico i-skip_next"></i><span class="lbl"></span><small></small></button>
    <button class="tab" data-tab="inbox"><i class="ico i-inbox"></i><span></span><em class="badge" id="inboxN" hidden></em></button>
    <button class="tab" data-tab="combos"><i class="ico i-workspace_premium"></i><span></span></button>
  </nav>
</div>
<div id="pop" class="hidden"></div>
<div id="modal" class="hidden"><div class="notice" id="notice"></div></div>
<div id="cover" hidden></div>

<!-- The build bundles main.js and its modules into one inline script here -->
<!-- @script -->
</body>
</html>
