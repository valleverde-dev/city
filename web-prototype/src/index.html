<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Eurocrat</title>
<!-- The build (scripts/build.mjs) inlines styles/index.css here, fonts included -->
<!-- @styles -->
</head>
<body>
<div id="app">
  <!-- v0.9: the map fills the screen; the HUD floats over it and one bar at the bottom does the rest (no sheets) -->
  <div id="world">
    <canvas id="map"></canvas>
    <div id="hud">
      <div class="brand"><span class="logo-art hud-logo"><span class="sr">Eurocrat</span></span><small id="townName"></small></div>
      <div id="goal">
        <div class="cap res" id="st-res">
          <div class="row"><i class="ico i-groups"></i><b id="residents">0</b><span class="of">/ <span id="target">0</span></span><em id="bneck"></em></div>
          <div class="pbar"><i id="resBar"></i></div>
        </div>
        <div class="cap months" id="st-month">
          <div class="row"><i class="ico i-event"></i><b id="monthsLeft">0</b><span class="of" id="monthsLbl"></span></div>
          <div class="pips" id="pips"></div>
        </div>
      </div>
      <div class="hud-r">
        <div class="cap money" id="st-funds"><i class="ico i-euro"></i><b id="funds">0</b><span class="debt" id="st-debt" hidden><i class="ico i-account_balance_wallet"></i><b id="debt">0</b></span></div>
        <button class="hud-btn" id="inboxBtn" aria-label="Inbox"><i class="ico i-inbox"></i><span class="badge" id="inboxN" hidden>0</span></button>
        <button class="hud-btn blue" id="menuBtn" aria-label="Menu"><i class="ico i-menu"></i></button>
      </div>
      <div id="meters">
        <button class="meter" id="m-local" data-m="local"><i class="ico i-how_to_vote"></i><span class="lbl"></span><span class="seg"></span><b>0</b></button>
        <button class="meter" id="m-neigh" data-m="neigh"><i class="ico i-diversity_3"></i><span class="lbl"></span><span class="seg"></span><b>0</b></button>
        <button class="meter" id="m-comp" data-m="comp"><i class="ico i-fact_check"></i><span class="lbl"></span><span class="seg"></span><b>0</b></button>
        <button class="meter" id="m-spent" data-m="spent"><i class="ico i-savings"></i><span class="lbl"></span><span class="seg"></span><b>0</b></button>
      </div>
      <div id="relics"></div>
    </div>
    <button id="dirPill" hidden></button>
    <div id="news"></div>
    <div id="guide" hidden></div>
    <div id="hint"></div>
    <div id="chips"></div>
    <div id="confirm" hidden></div>
    <div id="mapBtns">
      <button class="mapbtn" id="zoomInBtn" aria-label="Zoom in">+</button>
      <button class="mapbtn" id="zoomOutBtn" aria-label="Zoom out">−</button>
      <button class="mapbtn" id="centreBtn" aria-label="Centre"><i class="ico i-place"></i></button>
      <button class="mapbtn" id="rotateBtn" aria-label="Rotate view"><i class="ico i-rotate_right"></i></button>
    </div>
  </div>
  <div id="dock">
    <button id="runBtn"><i class="ico i-work"></i><span class="lbl"></span><span class="xpbar"><i></i></span><small id="xpTxt"></small><em class="badge" id="runN" hidden></em></button>
    <div id="ctx"><div id="ctxHead"></div><div id="strip"></div></div>
    <button id="endTurn"><i class="ico i-skip_next"></i><span class="lbl"></span><span class="slots" id="slots"></span><small></small></button>
  </div>
</div>
<div id="run" hidden></div>
<div id="pop" class="hidden"></div>
<div id="inbox" hidden></div>
<div id="modal" class="hidden"><div class="notice" id="notice"></div></div>
<div id="cover" hidden></div>

<!-- The build bundles main.js and its modules into one inline script here -->
<!-- @script -->
</body>
</html>
